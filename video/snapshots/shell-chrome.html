body {
  margin: 0;
  background: #eef1f7;
  font-family: "Open Sans", Arial, sans-serif;
}

/* ---------- Sidebar rail ---------- */
.rail {
  position: absolute;
  top: 0;
  left: 0;
  width: 72px;
  height: 100vh;
  min-height: 1009px;
  background: var(--rail-bg);
  box-shadow: 0 4px 10px 0 rgba(0,0,0,0.1);
  z-index: 3;
}

.rail-logo {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 25px;
  height: 28px;
}
.rail-logo svg { display:block; width:100%; height:100%; }

.rail-divider {
  position: absolute;
  top: 56px;
  left: 14px;
  width: 44px;
  height: 0;
  border-top: 1px solid var(--divider);
}

.rail-setup {
  position: absolute;
  top: 80px;
  left: 14px;
  width: 28px;
  height: 28px;
}
.rail-setup svg { display:block; width:100%; height:100%; }

.rail-item {
  position: absolute;
  left: 16px;
  width: 28px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.node-icon {
  position: relative;
  display: flex;
  width: 24px;
  height: 24px;
  font-size: 24px;
  font-style: normal;
  -webkit-font-smoothing: antialiased;
}
.node-icon::before,
.node-icon::after {
  font-family: "cyberark-ui-icons-duotone", "cyberark-ui-icons-stroke";
}
.node-icon::before {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
}
.node-icon::after {
  position: static;
  z-index: 0;
}

.icon-0::before { content: "\4bcf"; color: #122052; }
.icon-0::after  { content: "\4bce"; color: rgba(0,0,0,0); }
.icon-1::before { content: "\41b3"; color: #122052; }
.icon-1::after  { content: "\41b2"; color: rgba(0,0,0,0); }
.icon-2::before { content: "\41e1"; color: #122052; }
.icon-2::after  { content: "\41e0"; color: rgba(0,0,0,0); }
.icon-3::before { content: "\eb08"; color: #2e6bff; }
.icon-3::after  { content: "\eb07"; color: #e3ebff; }
.icon-4::before { content: "\4177"; color: #122052; }
.icon-4::after  { content: "\416e"; color: rgba(0,0,0,0); }
.icon-5::before { content: "\3cb5"; color: #122052; }
.icon-5::after  { content: "\3cb4"; color: rgba(0,0,0,0); }
.icon-6::before { content: "\52bb"; color: #122052; }
.icon-6::after  { content: "\52ba"; color: rgba(0,0,0,0); }

/* ---------- Header cluster ---------- */
.content-area {
  position: absolute;
  top: 0;
  left: 72px;
  right: 0;
  height: 100vh;
  min-height: 1009px;
  background: #ffffff;
}

.header-cluster {
  position: absolute;
  top: 19px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 34px;
  z-index: 1;
}

@supports (-moz-appearance: none) { * { scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track); scrollbar-width: thin; } }
[class^="cyb-duotone-icon-"], [class*=" cyb-duotone-icon-"] { font-size: 24px; position: relative; font-style: normal; -webkit-font-smoothing: antialiased; font-family: cyberark-ui-icons-duotone, cyberark-ui-icons-stroke !important; }
[class^="cyb-duotone-icon-"]::before, [class*=" cyb-duotone-icon-"]::before { z-index: 1; position: absolute; left: 0px; }
[class^="cyb-duotone-icon-"]::after, [class*=" cyb-duotone-icon-"]::after { z-index: 0; opacity: 1; }
[class^="cyb-duotone-icon-"]::before, [class*=" cyb-duotone-icon-"]::before { color: var(--color-icon-duotone-stroke); }
[class^="cyb-duotone-icon-"]::after, [class*=" cyb-duotone-icon-"]::after { color: var(--color-icon-duotone-fill); }
[class^="cyb-duotone-icon-"], [class*=" cyb-duotone-icon-"] { --icon-stroke-color: var(--color-icon-duotone-stroke); --icon-fill-color: var(--color-icon-duotone-fill); }
.cyb-duotone-icon-help-circle::after { content: "䞬"; }
.cyb-duotone-icon-help-circle::before { content: "䞭"; }
.cyb-duotone-icon-notification-02::after { content: "乒"; }
.cyb-duotone-icon-notification-02::before { content: "乓"; }
.flex { display: flex !important; }
.align-items-center { align-items: center !important; }
.relative { position: relative !important; }
.cursor-pointer { cursor: pointer !important; }
button[mat-flat-button].mat-mdc-button-base { --mat-button-filled-label-text-size: 14px; --mdc-typography-button-font-weight: 600; border-radius: 8px; padding-left: 12px; padding-right: 12px; height: 28px; background-color: transparent; }
button[mat-flat-button].mat-mdc-button-base .mat-mdc-button-touch-target { height: 100%; width: 100%; }
button[mat-flat-button].mat-mdc-button-base.large { height: 34px; }
button[mat-flat-button].mat-mdc-button-base { color: var(--color-button-primary-text-default); }
button[mat-flat-button].mat-link { color: var(--color-text-button-text-default); border-width: medium; border-style: none; border-color: currentcolor; border-image: none; }
