body {
  margin: 0;
  background: #eef1f7;
  font-family: "Open Sans", Arial, sans-serif;
}

/* ---------- Sidebar rail ---------- */
.rail {
  position: absolute;
  top: 0;
  left: 0;
  width: 72px;
  height: 100vh;
  min-height: 1009px;
  background: var(--rail-bg);
  box-shadow: 0 4px 10px 0 rgba(0,0,0,0.1);
  z-index: 3;
}

.rail-logo {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 25px;
  height: 28px;
}
.rail-logo svg { display:block; width:100%; height:100%; }

.rail-divider {
  position: absolute;
  top: 56px;
  left: 14px;
  width: 44px;
  height: 0;
  border-top: 1px solid var(--divider);
}

.rail-setup {
  position: absolute;
  top: 80px;
  left: 14px;
  width: 28px;
  height: 28px;
}
.rail-setup svg { display:block; width:100%; height:100%; }

.rail-item {
  position: absolute;
  left: 16px;
  width: 28px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.node-icon {
  position: relative;
  display: flex;
  width: 24px;
  height: 24px;
  font-size: 24px;
  font-style: normal;
  -webkit-font-smoothing: antialiased;
}
.node-icon::before,
.node-icon::after {
  font-family: "cyberark-ui-icons-duotone", "cyberark-ui-icons-stroke";
}
.node-icon::before {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
}
.node-icon::after {
  position: static;
  z-index: 0;
}

.icon-0::before { content: "\4bcf"; color: #122052; }
.icon-0::after  { content: "\4bce"; color: rgba(0,0,0,0); }
.icon-1::before { content: "\41b3"; color: #122052; }
.icon-1::after  { content: "\41b2"; color: rgba(0,0,0,0); }
.icon-2::before { content: "\41e1"; color: #122052; }
.icon-2::after  { content: "\41e0"; color: rgba(0,0,0,0); }
.icon-3::before { content: "\eb08"; color: #2e6bff; }
.icon-3::after  { content: "\eb07"; color: #e3ebff; }

.content-area {
  position: absolute;
  top: 0;
  left: 72px;
  right: 0;
  height: 100vh;
  min-height: 1009px;
  background: #ffffff;
}

.header-cluster {
  position: absolute;
  top: 18px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 32px;
  z-index: 1;
}

.sparkle-btn {
  width: 24px;
  height: 24px;
  padding: 4px;
  box-sizing: border-box;
  border-radius: 100px;
  border: 1px solid rgba(0,0,0,0);
  background: rgba(0,0,0,0);
  box-shadow: 0 0 16px 0 rgba(122,128,255,0.36);
  display: flex;
  align-items: center;
  justify-content: center;
}
.sparkle-btn svg { width: 16px; height: 16px; display:block; }

.bell-btn {
  position: relative;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
}
.bell-icon {
  position: relative;
  width: 24px;
  height: 24px;
  font-size: 24px;
  font-style: normal;
  display: flex;
}
.bell-icon::before,
.bell-icon::after {
  font-family: "cyberark-ui-icons-duotone", "cyberark-ui-icons-stroke";
}
.bell-icon::before {
  position: absolute;
  left: 0; top: 0;
  z-index: 1;
}
.bell-icon::after {
  position: static;
  z-index: 0;
}
.bell-icon::before { content: "\4e53"; color: var(--brand-blue); }
.bell-icon::after  { content: "\4e52"; color: #e3ebff; }

.bell-badge {
  position: absolute;
  top: -2px;
  right: 0;
  width: 17.75px;
  height: 17.75px;
  border-radius: 50%;
  background: var(--brand-blue);
  color: #ffffff;
  font-size: 10px;
  font-weight: 400;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.help-btn {
  display: flex;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  background: none;
  border: none;
}
.help-icon {
  position: relative;
  width: 24px;
  height: 24px;
  font-size: 24px;
  font-style: normal;
  display: flex;
}
.help-icon::before,
.help-icon::after {
  font-family: "cyberark-ui-icons-duotone", "cyberark-ui-icons-stroke";
}
.help-icon::before {
  position: absolute;
  left: 0; top: 0;
  z-index: 1;
}
.help-icon::after {
  position: static;
  z-index: 0;
}
.help-icon::before { content: "\47ad"; color: var(--brand-blue); }
.help-icon::after  { content: "\47ac"; color: #e3ebff; }
.help-label {
  color: var(--brand-blue);
  font-size: 14px;
  font-weight: 500;
  font-family: "Open Sans", Arial, sans-serif;
}

.header-divider {
  width: 0;
  height: 20px;
  border-right: 1px solid var(--divider);
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.avatar-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--brand-blue);
  display: flex;
  align-items: center;
  justify-content: center;
}
.initials {

  font-weight: 400;

.username {

}
